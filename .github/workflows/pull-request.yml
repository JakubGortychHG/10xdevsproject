name: Pull Request CI

on:
  pull_request:
    branches: [ master ]
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel in-progress workflows when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run ESLint
        run: npm run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    if: github.event.pull_request.draft == false
    
    env:
      NODE_ENV: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run unit tests with coverage
        run: npm run test:coverage
        
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          
      - name: Archive test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  status-comment:
    name: PR Status Comment
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    if: always() && github.event.pull_request.draft == false
    permissions:
      pull-requests: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/
        continue-on-error: true
        
      - name: Create status comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Get job statuses
            const lintStatus = '${{ needs.lint.result }}';
            const testStatus = '${{ needs.unit-tests.result }}';
            
            // Status emojis
            const getStatusEmoji = (status) => {
              switch(status) {
                case 'success': return '✅';
                case 'failure': return '❌';
                case 'cancelled': return '⏹️';
                case 'skipped': return '⏭️';
                default: return '❓';
              }
            };
            
            // Read coverage summary if available
            let coverageInfo = '';
            try {
              const coveragePath = path.join('coverage', 'coverage-summary.json');
              if (fs.existsSync(coveragePath)) {
                const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
                const total = coverage.total;
                coverageInfo = `
            ## 📊 Coverage Report
            
            | Metric | Percentage | Covered/Total |
            |--------|------------|---------------|
            | **Lines** | ${total.lines.pct}% | ${total.lines.covered}/${total.lines.total} |
            | **Functions** | ${total.functions.pct}% | ${total.functions.covered}/${total.functions.total} |
            | **Branches** | ${total.branches.pct}% | ${total.branches.covered}/${total.branches.total} |
            | **Statements** | ${total.statements.pct}% | ${total.statements.covered}/${total.statements.total} |
            `;
              }
            } catch (error) {
              coverageInfo = '\n## 📊 Coverage Report\n\n*Coverage report not available*\n';
            }
            
            // Overall status
            const overallStatus = (lintStatus === 'success' && testStatus === 'success') ? 'success' : 'failure';
            const overallEmoji = getStatusEmoji(overallStatus);
            
            const comment = `
            ## ${overallEmoji} Pull Request CI Status
            
            | Job | Status | Result |
            |-----|--------|---------|
            | **Linting** | ${getStatusEmoji(lintStatus)} | ${lintStatus} |
            | **Unit Tests** | ${getStatusEmoji(testStatus)} | ${testStatus} |
            
            ${coverageInfo}
            
            ---
            
            ${overallStatus === 'success' 
              ? '🎉 **All checks passed!** This PR is ready for review.' 
              : '🚨 **Some checks failed.** Please review the errors above and fix them before merging.'}
            
            <sub>Triggered by commit: \`${context.sha.substring(0, 7)}\`</sub>
            `;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Pull Request CI Status')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            } 